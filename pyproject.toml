[project]
name = "cogni-map"
version = "0.1.0"
description = "Cognitive mapping and probe analysis for language models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.4.1",  # ROCm version from custom index
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "h5py>=3.8.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "textual>=0.40.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "nnsight>=0.5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
constraint-dependencies = ["torch==2.4.1+rocm6.0"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.0"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm" },
]

